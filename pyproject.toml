[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gohttpx"
version = "2.1.2"
description = "通过本地 Go 服务扩展 HTTPX 请求能力"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = ["httpx>=0.28,<0.29"]

[project.urls]
Homepage = "https://github.com/Assistest/GoHTTPX"

[tool.setuptools]
package-dir = {"" = "python"}
py-modules = ["gohttpx", "_gohttpx_runtime", "_gohttpx_windows"]
packages = ["_gohttpx_bin"]

[tool.setuptools.package-data]
_gohttpx_bin = ["*.exe"]
