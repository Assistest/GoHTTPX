[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gohttpx"
version = "1.0.0"
description = "通过本地 Go 服务扩展 HTTPX 请求能力"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = ["httpx>=0.28,<0.29"]

[project.urls]
Homepage = "https://github.com/Assistest/GoHTTPX"

[tool.setuptools]
package-dir = {"" = "python"}
py-modules = ["gohttpx"]
