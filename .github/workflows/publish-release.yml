name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: python -m pip install build twine "httpx>=0.28,<0.29" cryptography
      - id: version
        run: python tools/release.py validate
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1
      # 保留 checkout 的 VCS 信息，发布前核验 wheel 内置 EXE 的源码提交。
      - run: python -m build --sdist --wheel
      - run: python -B -m unittest discover -s python -p "test_*.py" -v
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
      - run: python tools/release.py binary
      - run: python tools/release.py notes
      - uses: actions/upload-artifact@v4
        with:
          name: server-windows-amd64
          path: |
            dist/gohttpx-server-windows-amd64.exe*
            dist/RELEASE_NOTES.md
            dist/SHA256SUMS

  publish-pypi:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: release-assets/
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          merge-multiple: true
          path: release-assets/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --repo "$GITHUB_REPOSITORY" --title "${GITHUB_REF_NAME}" --notes-file release-assets/RELEASE_NOTES.md
